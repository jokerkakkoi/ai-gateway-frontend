server {
    listen 80;
    server_name _;

    root /var/www/ai-gateway-finops/dist;
    index index.html;

    # React Router uses history mode. Send deep links such as /keys back to
    # index.html so the client app can render the matching route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits hashed static assets under /assets, so they can be cached hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Keep the app shell fresh so new deployments are picked up quickly.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Do not serve hidden files if they are accidentally copied into the web root.
    location ~ /\. {
        deny all;
    }
}
